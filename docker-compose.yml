# VPS deployment — runs the bot as a single isolated container.
# Nothing here touches the host nginx / WordPress / React stack:
#   - the port is bound to 127.0.0.1 only (nginx reverse-proxies it),
#   - CPU / memory limits keep headless Chromium from starving the sites,
#   - the WhatsApp session lives in a named volume so redeploys never wipe it.
services:
  bot:
    build: .
    image: whatsapp-order-bot:latest
    container_name: whatsapp-order-bot
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      # Host-local only; never exposed to the internet directly.
      - "127.0.0.1:3010:3000"
    volumes:
      - wwebjs_auth:/app/.wwebjs_auth
      - ./logs:/app/logs
    # Chromium needs a larger /dev/shm than Docker's 64 MB default.
    shm_size: "512m"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1500M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  wwebjs_auth:
