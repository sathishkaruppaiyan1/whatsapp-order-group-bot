# /etc/nginx/sites-available/bot.conf
# Reverse-proxy for the WhatsApp order bot. Replace bot.queenstall.com with your subdomain.
# Certbot will add the HTTPS server block automatically (see deploy/VPS.md).
server {
    listen 80;
    listen [::]:80;
    server_name bot.queenstall.com;

    # WooCommerce webhook payloads are small; keep this tight.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
